<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Protótipo Metroidvania - Pixel Art</title>
    <style>
        body { background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        canvas { background: #333; border: 4px solid #fff; image-rendering: pixelated; }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Configurações do Sprite
const spriteSheet = new Image();
spriteSheet.src = 'watermarked_img_6953337215170635193.png'; // Use o nome do arquivo salvo

const spriteW = 100; // Largura aproximada de cada frame (ajuste conforme necessário)
const spriteH = 100; // Altura aproximada de cada frame
const scale = 2;

// Estados do Jogador
let player = {
    x: 50,
    y: 200,
    width: spriteW * scale,
    height: spriteH * scale,
    frameX: 0,
    frameY: 0, // 0: Idle, 1: Andar, 2: Correr, 3: Pular, 4: Socar
    speed: 4,
    velY: 0,
    jumping: false,
    punching: false,
    moving: false,
    facingRight: true
};

const keys = {};

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function update() {
    player.moving = false;

    // Movimentação lateral
    if (keys['ArrowRight']) {
        player.x += player.speed;
        player.facingRight = true;
        player.moving = true;
        player.frameY = keys['ShiftLeft'] ? 2 : 1; // Correr ou Andar
    } else if (keys['ArrowLeft']) {
        player.x -= player.speed;
        player.facingRight = false;
        player.moving = true;
        player.frameY = keys['ShiftLeft'] ? 2 : 1;
    }

    // Pulo (Gravidade básica)
    if (keys['Space'] && !player.jumping) {
        player.velY = -15;
        player.jumping = true;
        player.frameY = 3;
    }

    // Ataque
    if (keys['KeyZ']) {
        player.punching = true;
        player.frameY = 4;
    } else {
        player.punching = false;
    }

    // Física simples
    player.velY += 0.8; // Gravidade
    player.y += player.velY;

    if (player.y > 200) {
        player.y = 200;
        player.jumping = false;
        player.velY = 0;
    }

    // Reset para IDLE
    if (!player.moving && !player.jumping && !player.punching) {
        player.frameY = 0;
    }

    // Animação dos frames (loop simples)
    if (Date.now() % 100 < 20) { 
        player.frameX = (player.frameX + 1) % 6; 
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Chão simples
    ctx.fillStyle = '#555';
    ctx.fillRect(0, 300, canvas.width, 100);

    ctx.save();
    
    // Lógica para virar o sprite
    if (!player.facingRight) {
        ctx.translate(player.x + player.width, player.y);
        ctx.scale(-1, 1);
        ctx.drawImage(spriteSheet, player.frameX * spriteW, player.frameY * spriteH, spriteW, spriteH, 0, 0, player.width, player.height);
    } else {
        ctx.drawImage(spriteSheet, player.frameX * spriteW, player.frameY * spriteH, spriteW, spriteH, player.x, player.y, player.width, player.height);
    }
    
    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

spriteSheet.onload = () => loop();
</script>

</body>
</html>
